[package]
name = "nearlyhuman-near"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy"] }
near-contract-standards = "=5.30.0"
hex = "=0.4.3"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy", "unit-testing"] }
ed25519-dalek = "=2.2.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
strip = "symbols"
