<text x="750" y="721" font-size="15">x0–255 inclusive; diagram enlarged ×2 for annotation</text>
<text x="80" y="795" font-size="17">Readable type has priority over literal art-template pixels. Never shrink text to force the card into 96px.</text>
<text x="80" y="826" font-size="17">At P320 / 200% text, expand the card toward y40, compact the fixed HUD and use one vertical scroller.</text>
<text x="80" y="857" font-size="17">Move the action/fee footer into normal scroll flow when necessary. Keep every warning and focused control reachable.</text>
<text x="80" y="888" font-size="17">OS keyboard / browser chrome / safe-area changes may require the square to scroll in the visible phone viewport.</text>
<text x="80" y="919" font-size="17">Replay detail pauses message, camera and event time until Explicit Resume. Preparation detail pins reading while the job continues.</text>
<text x="80" y="950" font-size="17">Low fee prominence comes from hierarchy, not unreadable contrast or size. Body text remains accessible DOM-sized text.</text>
<text x="80" y="1018" font-size="15" font-weight="650">Source/contact, font metrics, touch sizes and dynamic overflow are pending actual P320/P390 implementation checks.</text>
