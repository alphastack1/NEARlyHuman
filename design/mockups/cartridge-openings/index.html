<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEARlyHuman · Cartridge-game openings</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eeeada;color:#172d3b;font-family:system-ui,sans-serif}body{display:flex;flex-direction:column;padding:14px;gap:10px;height:100dvh}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(17px,2.3vw,24px);margin:0}a{color:#315f55}nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;font-size:14px;padding:9px 13px;background:#f9f5e8;color:#172d3b;border:1px solid #92a28b;cursor:pointer;border-radius:4px}button[aria-pressed=true]{background:#172d3b;color:#fff6d6;border-color:#172d3b}main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}img{display:block;width:100%;height:100%;object-fit:contain}footer{display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:1.4}footer p{margin:0;max-width:950px}@media(max-width:600px){body{padding:10px}button{font-size:12px;padding:8px}footer{font-size:12px}header a{font-size:12px}}
</style>
<header><h1>NEARlyHuman · Game opening → Title → Play</h1><a href="README.md">Current direction</a></header>
<nav aria-label="Opening concept"><button aria-pressed="true" data-board="0">01 · Rise and Shine</button><button aria-pressed="false" data-board="1">02 · Special Delivery</button><button aria-pressed="false" data-board="2">03 · The House Wakes Up</button><button aria-pressed="false" data-board="3">04 · Pixel Rush</button></nav>
<main><img id="board" src="01-rise-and-shine.png" alt="Rise and Shine: pixel sunrise, title and dissolving roof, then gameplay in the same house"></main>
<footer><p id="caption">Sunrise → title and roof dissolve → the same house becomes playable. All three stages are pixel art.</p><a id="original" href="01-rise-and-shine.png">Open original</a></footer>
<script>
const boards=[
 ['01-rise-and-shine.png','Rise and Shine: pixel sunrise, title and dissolving roof, then gameplay in the same house','Sunrise → title and roof dissolve → the same house becomes playable. All three stages are pixel art.'],
 ['02-special-delivery.png','Special Delivery: box lands on the kitchen floor, opens into a title, then camera pulls back into play','Box lands → opens into the title → camera pulls back into the same room.'],
 ['03-the-house-wakes-up.png','The House Wakes Up: room assembles, title appears, then that room becomes playable','Room assembles → title appears over it → the same room becomes playable.'],
 ['04-pixel-rush.png','Pixel Rush: tile wave reveals the house, forms a title, then clears into gameplay','Pixel wave → title forms as the house emerges → wipe completes into play.']
];
document.querySelectorAll('[data-board]').forEach(button=>button.onclick=()=>{const data=boards[Number(button.dataset.board)];document.querySelectorAll('[data-board]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const image=document.querySelector('#board');image.src=data[0];image.alt=data[1];document.querySelector('#caption').textContent=data[2];document.querySelector('#original').href=data[0];});
</script>
</html>
